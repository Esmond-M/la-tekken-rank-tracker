name: Import Braacket Rankings

on:
  push:
    branches: [main]
    paths:
      - 'data/braacket-rankings.csv'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  import-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Import Braacket CSV export
        run: node scripts/import-braacket-rankings.js

      - name: Commit generated rankings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/braacket-rankings.json
          git diff --staged --quiet || git commit -m "chore: import braacket rankings"
          git push

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
        id: deployment
